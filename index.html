<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wilder Granola</title>
<link rel="stylesheet" href="https://use.typekit.net/sxy5ssh.css">
<style>
@font-face {
  font-family: 'TAYBirdie';
  src: url('TAYBirdieRegular.otf') format('opentype');
  font-weight: normal;
  font-style: normal;
}

* { margin: 0; box-sizing: border-box; }

html, body {
  height: 100%;
  overflow: hidden;
}

body {
  background: url('bg.jpg') center center no-repeat;
  background-size: cover;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding-top: 60px;
}

.logo {
  max-width: 600px;
  width: 80vw;
  height: auto;
  display: block;
}

.tagline, .cta, .cta-heading {
  color: #fff;
  font-family: 'jetsam-collection-kugelkopf', Georgia, serif;
  font-weight: 700;
  text-align: center;
  margin-top: 24px;
  font-size: 1.1rem;
}

.tagline {
  font-weight: 400;
  font-size: 1.6rem;
  text-transform: uppercase;
}

.cta-heading {
  font-size: 2rem;
  margin-top: 40px;
    text-transform: uppercase;

}

.dot {
  font-size: 0.5em;
  vertical-align: 0.3em;
}

.cta {
  margin-top: 8px;
}

.at {
  font-family: 'TAYBirdie', sans-serif;
  font-weight: 100;
}

.cta a {
  color: #fff;
  font-family: 'TAYBirdie', sans-serif;
  font-weight: 100;
  text-transform: uppercase;
  letter-spacing: -0.05em;
  text-decoration: none;
}
</style>
</head>
<body>
  <img class="logo" src="logo.png" alt="Wilder Granola">
  <p class="tagline">Homemade small batch granola from DC</p>
  <p class="cta-heading"><span class="dot">●</span> Go <span class="dot">●</span> Wild <span class="dot">●</span></p>
  <p class="cta">Order at:<br><a href="mailto:WilderGranola@gmail.com">WilderGranola<span class="at">@</span>gmail.com</a></p>
</body>
</html>
